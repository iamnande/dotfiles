<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* layout: a sticky contents rail beside one reading column. requirements are the only boxed items,
   because every other section points at them. palette is everforest, the one the dotfiles already use. */
:root {
  --bg: #fdf6e3;
  --surface: #f4f0d9;
  --line: #ddd8c0;
  --fg: #4a555b;
  --ink: #2f383d;
  --muted: #647063;
  --accent: #4f7218;
  --accent-soft: #e6ecc4;
  --code: #efebd4;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --small: 0.8125rem;
  --label: 0.75rem;
  --body: 1.0625rem;
  --h2: 1.375rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2d353b;
    --surface: #343f44;
    --line: #4a555b;
    --fg: #d3c6aa;
    --ink: #ece3cc;
    --muted: #9aa79d;
    --accent: #a7c080;
    --accent-soft: #3a463f;
    --code: #272e33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2d353b;
  --surface: #343f44;
  --line: #4a555b;
  --fg: #d3c6aa;
  --ink: #ece3cc;
  --muted: #9aa79d;
  --accent: #a7c080;
  --accent-soft: #3a463f;
  --code: #272e33;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--body);
  line-height: 1.6;
}
.page {
  max-width: 78rem;
  margin-inline: auto;
  padding-inline: clamp(1rem, 4vw, 2.5rem);
  padding-block: 2.5rem 4rem;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
strong { color: var(--ink); }

/* header */
.top {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding-bottom: 1.75rem;
  border-bottom: 1px solid var(--line);
}
.eyebrow, .stats { margin: 0; font-family: var(--font-mono); font-size: var(--small); }
.eyebrow { letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.stats { color: var(--muted); }
h1 {
  margin: 0;
  max-width: 26ch;
  font-size: clamp(1.625rem, 4vw, 2.25rem);
  line-height: 1.15;
  font-weight: 700;
  color: var(--ink);
  text-wrap: balance;
}
.tabs { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.75rem; }
.tabs button {
  font: inherit;
  font-size: 0.9375rem;
  padding: 0.375rem 0.875rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* columns */
.cols {
  display: grid;
  grid-template-columns: 15rem minmax(0, 1fr);
  gap: 3rem;
  align-items: start;
  padding-top: 2rem;
}
main { min-width: 0; }
.status { margin: 0; color: var(--muted); }

/* contents rail */
.toc {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
  font-size: 0.9375rem;
  line-height: 1.35;
}
.toc > summary {
  display: none;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: var(--label);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.125rem; }
.toc-list a {
  display: block;
  padding: 0.3125rem 0.625rem;
  border-radius: 4px;
  color: var(--fg);
  text-decoration: none;
}
.toc-list a:hover { background: var(--surface); }
.toc-list a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.req-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(2.5rem, 1fr));
  gap: 0.25rem;
  padding: 0.375rem 0.625rem 0.5rem;
}
.req-grid a {
  padding: 0.1875rem 0;
  border-radius: 4px;
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: var(--label);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.req-grid a:hover { background: var(--accent-soft); color: var(--accent); }

/* document */
.doc { display: flex; flex-direction: column; gap: 2.5rem; }
.doc section, .doc .lede { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.doc section { scroll-margin-top: 1rem; }
.doc :is(p, ul, ol, h2, h3, h4, blockquote, pre) { margin: 0; }
.doc :is(p, ul, ol, h3, h4, blockquote) { max-width: 44rem; }
.doc h2 {
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
  font-size: var(--h2);
  line-height: 1.25;
  color: var(--ink);
  text-wrap: balance;
}
.doc h3, .doc h4 { font-size: var(--body); color: var(--ink); }
.doc :is(ul, ol) { padding-left: 1.375rem; display: flex; flex-direction: column; gap: 0.5rem; }
.doc li > :is(ul, ol) { margin-top: 0.5rem; }
.doc li > p + p { margin-top: 0.5rem; }
.doc li::marker { color: var(--muted); }
.doc blockquote { padding-left: 1rem; border-left: 2px solid var(--line); color: var(--muted); }
code {
  padding: 0.1em 0.35em;
  border-radius: 4px;
  background: var(--code);
  font-family: var(--font-mono);
  font-size: 0.9em;
  overflow-wrap: anywhere;
}
pre { overflow-x: auto; padding: 1rem; border-radius: 6px; background: var(--code); font-size: 0.9375rem; line-height: 1.5; }
pre code { padding: 0; background: none; font-size: inherit; overflow-wrap: normal; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; line-height: 1.45; }
table.wide { min-width: 42rem; }
th, td { padding: 0.625rem 0.875rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th {
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: var(--label);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--muted);
}
td:first-child { font-weight: 600; color: var(--ink); }

/* requirements */
.doc ul.reqs { list-style: none; padding: 0; max-width: 48rem; }
.req {
  display: grid;
  grid-template-columns: 3rem minmax(0, 1fr);
  column-gap: 0.75rem;
  padding: 0.875rem 1rem;
  border-radius: 6px;
  background: var(--surface);
  scroll-margin-top: 1rem;
}
.req-id { font-family: var(--font-mono); font-size: 0.9375rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.req-name { font-weight: 700; color: var(--ink); }
.req.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.rref {
  font-family: var(--font-mono);
  font-size: 0.9em;
  font-weight: 600;
  text-decoration: underline dotted;
  text-underline-offset: 0.2em;
  white-space: nowrap;
}

.foot {
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
  font-size: var(--small);
  color: var(--muted);
}

@media (max-width: 56rem) {
  .cols { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; padding-top: 1.5rem; }
  .toc {
    position: static;
    max-height: none;
    padding: 0.75rem 1rem;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .toc > summary { display: list-item; }
  .toc[open] > summary { margin-bottom: 0.625rem; }
}
</style>

<div class="page">
  <header class="top">
    <p class="eyebrow" id="eyebrow">plan docs</p>
    <h1 id="doc-title">loading</h1>
    <p class="stats" id="doc-stats"></p>
    <div class="tabs" id="tabs" role="tablist" aria-label="documents" hidden></div>
  </header>
  <div class="cols">
    <details class="toc" id="toc" open>
      <summary>contents</summary>
      <nav id="toc-nav" aria-label="contents"></nav>
    </details>
    <main id="main"><p class="status" id="status">loading the plan docs</p></main>
  </div>
  <footer class="foot">rendered from the markdown published beside this page. the files in git are the source of truth.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function () {
  // markdown files published beside this page. a missing one is skipped.
  const DOCS = [
    { key: 'prd', file: 'prd.md', label: 'PRD' },
    { key: 'spec', file: 'tech-spec.md', label: 'tech spec' },
  ];
  const REQ = /\bR\d{1,3}\b/g;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const narrow = window.matchMedia('(max-width: 56rem)');

  const reqs = new Map(); // id -> name
  const loaded = [];
  let active = null;
  let spy = null;

  async function load(doc) {
    const inline = window.PLAN_DOCS && window.PLAN_DOCS[doc.file];
    if (typeof inline === 'string') return inline;
    try {
      const res = await fetch(doc.file, { cache: 'no-store' });
      if (!res.ok) return null;
      const text = await res.text();
      if (!text.trim() || /^\s*<(!doctype|html)/i.test(text)) return null;
      return text;
    } catch (e) {
      return null;
    }
  }

  function build(doc, md) {
    const tmp = el('div');
    tmp.innerHTML = marked.parse(md, { gfm: true, headerIds: false, mangle: false });

    const h1 = tmp.querySelector('h1');
    doc.title = h1 ? h1.textContent.replace(/^(prd|tech spec):\s*/i, '') : doc.label;
    if (h1) h1.remove();

    const article = el('article', 'doc');
    article.id = 'doc-' + doc.key;
    const lede = el('div', 'lede');
    let cur = lede;
    article.append(lede);
    doc.sections = [];
    for (const node of Array.from(tmp.childNodes)) {
      if (node.nodeType === 1 && node.tagName === 'H2') {
        const title = node.textContent.trim();
        cur = el('section');
        cur.id = doc.key + '-' + slug(title);
        doc.sections.push({ id: cur.id, title, el: cur });
        article.append(cur);
      }
      if (node.nodeType === 1) cur.append(node);
    }
    if (!lede.children.length) lede.remove();

    article.querySelectorAll('table').forEach((table) => {
      const wrap = el('div', 'table-wrap');
      if (table.querySelectorAll('thead th').length > 2) table.classList.add('wide');
      table.replaceWith(wrap);
      wrap.append(table);
    });

    // "- **R12 name.** text" becomes an addressable requirement
    doc.reqIds = [];
    article.querySelectorAll('li').forEach((li) => {
      const strong = li.querySelector(':scope > strong:first-child, :scope > p:first-child > strong:first-child');
      if (!strong) return;
      const m = /^(R\d{1,3})\s+(.+?)\.?$/.exec(strong.textContent.trim());
      if (!m || reqs.has(m[1])) return;
      const holder = strong.parentNode;
      strong.remove();
      if (holder.firstChild && holder.firstChild.nodeType === 3) {
        holder.firstChild.nodeValue = holder.firstChild.nodeValue.replace(/^\s+/, '');
      }
      const text = el('div', 'req-text');
      const body = el('div', 'req-body');
      while (li.firstChild) body.append(li.firstChild);
      text.append(el('div', 'req-name', m[2]), body);
      li.append(el('span', 'req-id', m[1]), text);
      li.id = m[1];
      li.classList.add('req');
      li.parentNode.classList.add('reqs');
      reqs.set(m[1], m[2]);
      doc.reqIds.push(m[1]);
    });

    doc.el = article;
  }

  // every mention of a known requirement links to it
  function linkRefs(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        REQ.lastIndex = 0;
        if (!REQ.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest('a, code, pre, h2, h3, .req-id, .req-name')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const text = n.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0;
      let m;
      REQ.lastIndex = 0;
      while ((m = REQ.exec(text))) {
        if (!reqs.has(m[0])) continue;
        frag.append(text.slice(last, m.index));
        const a = el('a', 'rref', m[0]);
        a.href = '#' + m[0];
        a.title = reqs.get(m[0]);
        frag.append(a);
        last = m.index + m[0].length;
      }
      if (!last) continue;
      frag.append(text.slice(last));
      n.replaceWith(frag);
    }
  }

  function renderToc(doc) {
    const nav = $('toc-nav');
    nav.textContent = '';
    const list = el('ul', 'toc-list');
    for (const s of doc.sections) {
      const li = el('li');
      const a = el('a', null, s.title.toLowerCase());
      a.href = '#' + s.id;
      li.append(a);
      if (/^requirements$/i.test(s.title) && doc.reqIds.length) {
        const grid = el('div', 'req-grid');
        for (const id of doc.reqIds) {
          const chip = el('a', null, id);
          chip.href = '#' + id;
          chip.title = reqs.get(id);
          grid.append(chip);
        }
        li.append(grid);
      }
      list.append(li);
    }
    nav.append(list);
  }

  function watch(doc) {
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const links = new Map();
    $('toc-nav').querySelectorAll('.toc-list > li > a').forEach((a) => links.set(a.getAttribute('href').slice(1), a));
    spy = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        links.forEach((a) => a.removeAttribute('aria-current'));
        const a = links.get(entry.target.id);
        if (a) a.setAttribute('aria-current', 'true');
      }
    }, { rootMargin: '-10% 0px -80% 0px' });
    doc.sections.forEach((s) => spy.observe(s.el));
  }

  function activate(doc) {
    active = doc;
    for (const d of loaded) d.el.hidden = d !== doc;
    $('eyebrow').textContent = doc.label;
    $('doc-title').textContent = doc.title;
    const parts = [doc.sections.length + ' sections'];
    if (doc.reqIds.length) parts.push(doc.reqIds.length + ' requirements');
    parts.push(doc.file);
    $('doc-stats').textContent = parts.join(' · ');
    $('tabs').querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.key === doc.key));
    });
    renderToc(doc);
    watch(doc);
  }

  function go(id) {
    const byKey = loaded.find((d) => d.key === id);
    if (byKey) {
      activate(byKey);
      window.scrollTo(0, 0);
      return true;
    }
    const target = document.getElementById(id);
    if (!target) return false;
    const doc = loaded.find((d) => d.el.contains(target));
    if (!doc) return false;
    if (doc !== active) activate(doc);
    if (narrow.matches) $('toc').open = false;
    target.scrollIntoView({ block: 'start' });
    if (target.classList.contains('req')) {
      document.querySelectorAll('.req.flash').forEach((n) => n.classList.remove('flash'));
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 2400);
    }
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    return true;
  }

  async function start() {
    const texts = await Promise.all(DOCS.map(load));
    DOCS.forEach((doc, i) => {
      if (!texts[i]) return;
      build(doc, texts[i]);
      loaded.push(doc);
    });

    if (!loaded.length) {
      $('doc-title').textContent = 'nothing to show';
      $('status').textContent = 'no plan docs were published beside this page. it looks for prd.md and tech-spec.md.';
      return;
    }

    const main = $('main');
    main.textContent = '';
    for (const doc of loaded) {
      linkRefs(doc.el);
      main.append(doc.el);
    }

    if (loaded.length > 1) {
      const tabs = $('tabs');
      for (const doc of loaded) {
        const b = el('button', null, doc.label);
        b.type = 'button';
        b.id = 'tab-' + doc.key;
        b.dataset.key = doc.key;
        b.setAttribute('role', 'tab');
        b.addEventListener('click', () => go(doc.key));
        tabs.append(b);
      }
      tabs.hidden = false;
    }

    $('toc').open = !narrow.matches;
    narrow.addEventListener('change', () => { $('toc').open = !narrow.matches; });

    activate(loaded[0]);
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash) go(hash);
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    if (go(decodeURIComponent(a.getAttribute('href').slice(1)))) e.preventDefault();
  });

  start();
})();
</script>
