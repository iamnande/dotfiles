# General settings
general {
    hide_cursor = false
}

# Authentication configuration
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
}

# Animation settings
animations {
    enabled = true
}
bezier = overshot, 0.05, 0.9, 0.1, 1.1
animation = fadeIn, 1, 8, overshot
animation = fadeOut, 1, 8, overshot

# Widgets
# the console nameplate, big - everforest by name from waybar's everforest.css.
# no image, so the lock never looks like the desktop
background {
    monitor =
    color = rgb(2d353b) # bg0
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(d3c6aa) # fg
    font_size = 54
    font_family = OpenDyslexicM Nerd Font Mono
    position = 0, 230
    halign = center
    valign = center
}

# name - the house font has no bold, so its sibling's real one
label {
    monitor =
    text = <b>rocinante</b>
    color = rgb(a7c080) # green
    font_size = 72
    font_family = OpenDyslexic Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# label, same as tty2's banner
label {
    monitor =
    text = legitimate salvage
    color = rgb(7a8478) # grey0
    font_size = 24
    font_family = OpenDyslexicM Nerd Font Mono
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 44
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgb(a7c080) # green
    inner_color = rgb(2d353b) # bg0
    font_color = rgb(d3c6aa) # fg
    font_family = OpenDyslexicM Nerd Font Mono
    fade_on_empty = false
    placeholder_text =
    rounding = 4
    check_color = rgb(dbbc7f) # yellow
    fail_color = rgb(e67e80) # red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = eh bien, let us bring order to this chaos.
    color = rgb(7a8478) # grey0
    font_size = 18
    font_family = OpenDyslexicM Nerd Font Mono
    position = 0, 60
    halign = center
    valign = bottom
}
